services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: app_cobranza_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_cobranza
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_cobranza"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
